<section class="dashboard" data-testid="dashboard-home">
  <header class="dashboard-header">
    <div>
      <h1>📊 Trading Dashboard</h1>
      <p *ngIf="authSession.currentUser() as user">
        Welcome back, <strong>{{ user.username }}</strong>
      </p>
    </div>
  </header>

  <p *ngIf="isLoading()" class="status" data-testid="dashboard-loading" style="background-color: #e6fffa; color: #234e52; border-left: 4px solid #4299e1;">⏳ Loading your account data...</p>

  <div *ngIf="loadError() as error" class="status status-error" data-testid="dashboard-error">
    <p>{{ error }}</p>
    <button type="button" (click)="refresh()">🔄 Retry</button>
  </div>

  <ng-container *ngIf="!isLoading() && !loadError()">
    <!-- Account summary removed; use routed Account page instead -->

    <!-- Quick Actions removed; navigation is handled by top header -->

    <section class="dashboard-card" data-testid="positions-list">
      <h2>Positions</h2>
      <p *ngIf="positions().length === 0" class="status">No open positions.</p>
      <table *ngIf="positions().length > 0">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Quantity</th>
            <th>Average Cost</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let position of positions()">
            <td>{{ position.symbol }}</td>
            <td>{{ position.quantity }}</td>
            <td>{{ position.averageCost | number:'1.2-2' }}</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- Order history and watchlists moved to routed pages: /orders/history and /watchlists -->
  </ng-container>
</section>
