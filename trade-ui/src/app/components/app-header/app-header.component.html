<header class="top-header">
  <div class="header-content">
    <span class="brand">Trade Platform</span>
    <div class="header-actions">
      <button
        type="button"
        class="btn-theme"
        (click)="toggleTheme()"
        [title]="themeService.currentTheme() === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
        data-testid="theme-toggle-button"
        aria-label="Toggle theme"
      >
        <span class="theme-icon" *ngIf="themeService.currentTheme() === 'dark'">☀️</span>
        <span class="theme-icon" *ngIf="themeService.currentTheme() === 'light'">🌙</span>
      </button>

      <!-- Global profile menu -->
      <div class="profile-menu" *ngIf="authSession.isAuthenticated()">
        <button class="profile-button" (click)="toggleProfileMenu()" aria-label="Open profile menu">
          <span class="profile-initial">{{ authSession.currentUser()?.username?.charAt(0)?.toUpperCase() }}</span>
        </button>

        <div class="profile-dropdown" *ngIf="menuOpen">
          <button type="button" (click)="goToProfile()">Update profile</button>
          <button type="button" (click)="emitRefresh()">Refresh</button>
          <button type="button" (click)="onSignOut()">Sign out</button>
        </div>
      </div>
    </div>
  </div>
</header>
