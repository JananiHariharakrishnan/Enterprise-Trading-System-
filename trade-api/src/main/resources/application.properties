spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:trade-api/.env[.properties],optional:file:Database/.env[.properties],optional:file:../Database/.env[.properties]
spring.datasource.hikari.initializationFailTimeout=1000

spring.application.name=trade-api
server.port=${SERVER_PORT:8888}

spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trading}}
spring.datasource.username=${DB_USER:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

mybatis.mapper-locations=classpath*:mapper/*.xml
mybatis.type-handlers-package=com.tradingsystem.mapper.typehandler

auth.jwt.secret=${JWT_SECRET:development-only-shared-secret-change-me}
auth.jwt.issuer=${JWT_ISSUER:auth-stub}



# Kafka broker
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}


# Producer Configuration

# JSON events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Delivery semantics
spring.kafka.producer.acks=all
spring.kafka.producer.enable-idempotence=true

# Retry configuration
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5


# Consumer Configuration

# IMPORTANT:
# orders has one logical consumer group
# trade-events/market-data have separate groups
# Change group id per service
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:trade-executor}

spring.kafka.consumer.auto-offset-reset=earliest


# Manual offset commit
spring.kafka.consumer.enable-auto-commit=false


# JSON events
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


# Allow event classes
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tradingsystem.*


# Listener Configuration

# Commit offset after successful processing
spring.kafka.listener.ack-mode=manual

