spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:trade-api/.env[.properties],optional:file:Database/.env[.properties],optional:file:../Database/.env[.properties]

spring.application.name=trade-api
server.port=${SERVER_PORT:8081}

# =========================================================
# Database Configuration
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trading}}
spring.datasource.username=${DB_USER:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.datasource.hikari.connection-init-sql=SET search_path TO tradingsystem, authentication, public

spring.jpa.hibernate.ddl-auto=validate

# =========================================================
# Kafka Configuration
# =========================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:10.8.71.111:9092}
mybatis.mapper-locations=classpath*:mapper/*.xml
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=2147483647
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Prevent Java type headers from being added to JSON events
spring.kafka.producer.properties.spring.json.add.type.headers=false

# =========================================================
# Kafka Consumer
# =========================================================

# Make consumer group explicit for demo environments; override with env if needed
KAFKA_CONSUMER_GROUP_ID=trade-executor
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:trade-executor}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# =========================================================
# Kafka Topics & Consumer Groups
# =========================================================

app.kafka.orders-topic=orders
app.kafka.trade-events-topic=${KAFKA_TRADE_EVENTS_TOPIC:trade-events}
app.kafka.notification-group-id=${KAFKA_NOTIFICATION_GROUP_ID:trade-notification-service}

# =========================================================
# Email / Notification Service Configuration
# =========================================================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.notification.mail.enabled=${MAIL_ENABLED:true}
app.notification.mail.from=${MAIL_FROM:${spring.mail.username:}}

# =========================================================
# Kafka Listener
# =========================================================

spring.kafka.listener.ack-mode=manual

# =========================================================
# Fauxnance API Configuration
# =========================================================

# Register the package containing custom MyBatis type handlers
mybatis.type-handlers-package=com.tradingsystem.mapper.typehandler
fauxnance.api.base-url=${FAUXNANCE_API_BASE_URL:https://api.fauxnance.io}
fauxnance.api.key=${FAUXNANCE_API_KEY:}
fauxnance.api.quote-endpoint=/quotes
fauxnance.api.timeout-seconds=${FAUXNANCE_TIMEOUT_SECONDS:5}
fauxnance.api.max-retries=${FAUXNANCE_MAX_RETRIES:3}
fauxnance.api.retry-delay-ms=${FAUXNANCE_RETRY_DELAY_MS:1000}

# =========================================================
# Demo / test listener toggles (keep test listener disabled by default)
# =========================================================

# Set to true to enable the optional test listener that prints messages (ONLY in dev/test)
app.kafka.test-listener.enabled=false
app.kafka.test-listener.group-id=test-listener

# =========================================================
# Logging - ensure INFO logs are visible in demo
# =========================================================

logging.level.com.tradingsystem=INFO
logging.level.root=INFO