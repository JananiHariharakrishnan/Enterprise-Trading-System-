spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:Services/trade-executor/.env[.properties],optional:file:trade-executor/.env[.properties],optional:file:Database/.env[.properties],optional:file:../Database/.env[.properties]

spring.application.name=trade-executor
server.port=${SERVER_PORT:8082}

# Database Configuration
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trading}}}
spring.datasource.username=${DB_USER:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.hibernate.ddl-auto=validate

# Trade API Configuration
trade.api.base-url=${TRADE_API_BASE_URL:${TRADE_API_URL:http://localhost:8081}}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer Configuration for trade-events
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.enable-idempotence=true
spring.kafka.producer.retries=10
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Kafka Consumer
# Ensure the executor uses a known consumer group for `orders`
KAFKA_CONSUMER_GROUP_ID=trade-executor
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:trade-executor}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Listener Configuration
spring.kafka.listener.ack-mode=manual

# Fauxnance API Configuration
fauxnance.api.base-url=${FAUXNANCE_API_BASE_URL:https://y4t9nq2bqf.execute-api.eu-west-2.amazonaws.com/v1}
fauxnance.api.key=${FAUXNANCE_API_KEY:}
fauxnance.api.quote-endpoint=/quotes
fauxnance.api.timeout-seconds=${FAUXNANCE_TIMEOUT_SECONDS:5}
fauxnance.api.max-retries=${FAUXNANCE_MAX_RETRIES:3}
fauxnance.api.retry-delay-ms=${FAUXNANCE_RETRY_DELAY_MS:1000}

market-data.poller.interval-seconds=${POLL_INTERVAL_SECONDS:3600}

# Logging - ensure INFO logs are visible in demo
logging.level.com.tradingsystem=INFO
logging.level.root=INFO